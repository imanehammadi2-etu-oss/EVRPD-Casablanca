version: '3.8'

services:
  evrpd-casablanca:
    build:
      context: .
      dockerfile: Dockerfile
    image: evrpd-casablanca:latest
    container_name: evrpd_casablanca_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - ./data:/app/data
      - ./clients_database.json:/app/clients_database.json
      - ./simulation_records.json:/app/simulation_records.json
      - ./simulation_records_agentic.json:/app/simulation_records_agentic.json
