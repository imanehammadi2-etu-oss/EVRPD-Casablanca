hpo:
  objective_metric: "mae"
  direction: "minimize"
  n_trials: 20
  seed: 42
  early_stopping_patience: 5

patchtst:
  defaults:
    context_length: 24
    prediction_length: 24
    patch_len: 8
    stride: 4
    patch_stride_mode: "half_patch"
    d_model: 128
    n_heads: 8
    n_layers: 3
    d_ff_multiplier: 4
    dropout: 0.10
    attention_dropout: 0.05
    learning_rate: 0.0005
    batch_size: 32
    weight_decay: 0.0001
    use_revin: true
    channel_independence: true
    loss: "mae"
  search_space:
    context_length: [24, 48, 96, 168]
    prediction_length: [6, 12, 24]
    patch_len: [4, 8, 12, 16, 24]
    patch_stride_mode: ["half_patch", "full_patch"]
    d_model: [64, 128, 256]
    n_heads: [2, 4, 8]
    n_layers: {low: 2, high: 6}
    d_ff_multiplier: [2, 4]
    dropout: {low: 0.0, high: 0.30}
    learning_rate: {low: 0.00001, high: 0.001, log: true}
    batch_size: [16, 32, 64]
    weight_decay: {low: 0.000001, high: 0.001, log: true}

gpt_forecaster:
  defaults:
    context_length: 48
    prediction_length: 24
    patch_len: 8
    stride: 4
    patch_stride_mode: "half_patch"
    d_model: 128
    n_heads: 8
    n_layers: 4
    d_ff_multiplier: 4
    dropout: 0.10
    attention_dropout: 0.05
    learning_rate: 0.0004
    batch_size: 32
    weight_decay: 0.0001
    freeze_backbone: false
    trainable_layers: 2
    use_revin: true
    loss: "mae"
  search_space:
    context_length: [48, 96, 168, 336]
    prediction_length: [6, 12, 24]
    patch_len: [4, 8, 12, 16, 24]
    patch_stride_mode: ["half_patch", "full_patch"]
    d_model: [64, 128, 256]
    n_heads: [2, 4, 8]
    n_layers: [2, 4, 6]
    d_ff_multiplier: [2, 4]
    dropout: {low: 0.0, high: 0.30}
    attention_dropout: {low: 0.0, high: 0.20}
    learning_rate: {low: 0.00001, high: 0.001, log: true}
    batch_size: [16, 32, 64]
    weight_decay: {low: 0.000001, high: 0.001, log: true}
    freeze_backbone: [true, false]
    trainable_layers: [0, 1, 2, 4]
    use_revin: [true, false]

lstn:
  defaults:
    context_length: 24
    prediction_length: 24
    short_term_window: 12
    rnn_type: "LSTM"
    lstm_units: 64
    num_lstm_layers: 2
    rnn_dropout: 0.10
    recurrent_dropout: 0.10
    attention_units: 64
    d_model: 64
    n_heads: 4
    num_transformer_layers: 1
    d_ff_multiplier: 2
    fusion_method: "gated"
    fusion_hidden_dim: 128
    dropout: 0.10
    learning_rate: 0.0010
    batch_size: 32
    weight_decay: 0.0001
    loss: "mae"
  search_space:
    context_length: [24, 48, 96, 168]
    prediction_length: [6, 12, 24]
    short_term_window: [6, 12, 24]
    rnn_type: ["LSTM", "GRU"]
    lstm_units: [32, 64, 128, 256]
    num_lstm_layers: {low: 1, high: 3}
    rnn_dropout: {low: 0.0, high: 0.30}
    recurrent_dropout: {low: 0.0, high: 0.30}
    attention_units: [32, 64, 128, 256]
    d_model: [64, 128, 256]
    n_heads: [2, 4, 8]
    num_transformer_layers: [1, 2, 3]
    d_ff_multiplier: [2, 4]
    fusion_method: ["concat", "sum", "gated"]
    fusion_hidden_dim: [64, 128, 256]
    dropout: {low: 0.0, high: 0.30}
    learning_rate: {low: 0.00001, high: 0.001, log: true}
    batch_size: [16, 32, 64]
    weight_decay: {low: 0.000001, high: 0.001, log: true}

forecasting_agent:
  defaults:
    selection_strategy: "weighted_ensemble"
    selection_metric: "mae"
    ensemble_size: 3
    weights_method: "inverse_rmse"
    consensus_threshold: 0.85
    fallback_strategy: "best_model"
    max_debate_rounds: 3
    weight_patchtst: 0.40
    weight_gpt: 0.40
    weight_lstn: 0.20
  search_space:
    selection_strategy: ["best_model", "weighted_ensemble", "dynamic_selection"]
    selection_metric: ["mae", "rmse", "smape"]
    ensemble_size: [2, 3, 4]
    weights_method: ["uniform", "fixed", "inverse_mae", "inverse_rmse"]
    consensus_threshold: [0.70, 0.75, 0.80, 0.85, 0.90]
    fallback_strategy: ["best_model", "seasonal_naive", "xgboost", "robust_scenarios"]
    max_debate_rounds: [1, 2, 3, 4]
